# Uncomment the following lines to enable the Corne RGB Underglow
# CONFIG_ZMK_RGB_UNDERGLOW=y
# CONFIG_WS2812_STRIP=y

# Uncomment the following line to enable the Corne OLED Display
CONFIG_ZMK_DISPLAY=y

# Note: Layer status widget is provided by nice_view shield automatically
# Do not enable CONFIG_ZMK_WIDGET_LAYER_STATUS as it conflicts with nice_view widget

# Bluetooth device name (applies to both halves)

# 30 min deep sleep
CONFIG_ZMK_SLEEP=y

# Enabling mouse movement
CONFIG_ZMK_POINTING=y

# increase bt power 
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

CONFIG_BT_DEVICE_NAME="Corne Keyboard"
